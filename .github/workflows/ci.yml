name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run again by the deploy, so nothing reaches production untested.
  workflow_call:

concurrency:
  # Keyed on the workflow too: when the deploy calls this, github.workflow is
  # "Deploy", so it never cancels (or waits on) a CI run of the same commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # For the Postgres store's contract tests, which skip without it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTERVIEW_BOT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_bot_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm 10 crashes resolving this dependency tree (arborist "edgesOut" bug).
      - run: npm install -g npm@12

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The image the deploy runs, built so a broken Dockerfile fails here rather
  # than on Render.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build .
