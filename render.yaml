# Render Blueprint for the hosted deployment, on the free plan.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: interview-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deployed by .github/workflows/deploy.yml once CI has passed, never on a
    # bare push.
    autoDeployTrigger: "off"
    envVars:
      # Asked for when the Blueprint is first applied, and never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
