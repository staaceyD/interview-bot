# Render Blueprint for the hosted deployment, on the free plan.
services:
  - type: web
    name: interview-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      # Generated by Render once, and kept: changing it signs everyone out.
      - key: INTERVIEW_BOT_SESSION_SECRET
        generateValue: true
      # Every value below is asked for when the Blueprint is first applied, and
      # never committed.
      # Neon's two strings for the production branch, under the names
      # `neon deploy` gives them: pooled for queries, direct for the schema.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INTERVIEW_BOT_GOOGLE_CLIENT_ID
        sync: false
      - key: INTERVIEW_BOT_GOOGLE_CLIENT_SECRET
        sync: false
      - key: INTERVIEW_BOT_GITHUB_CLIENT_ID
        sync: false
      - key: INTERVIEW_BOT_GITHUB_CLIENT_SECRET
        sync: false
      # A JSON list, e.g. ["you@example.com"]: never counted against the limits.
      - key: INTERVIEW_BOT_UNLIMITED_EMAILS
        sync: false
