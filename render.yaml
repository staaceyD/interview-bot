# Render Blueprint for the hosted deployment, on the free plan.
services:
  - type: web
    name: interview-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      # Asked for when the Blueprint is first applied, and never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
