# The database a local run uses. Bound to localhost only, which is why it can
# go without a password.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: interview_bot
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
